services:
  # ---------------------------------------------------------------------------
  # Django Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: gechexpress-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gechexpress-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gechexpress-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:3000
      - key: JWT_AUTH_COOKIE_SAMESITE
        value: None
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # Redis Cache Service
  # ---------------------------------------------------------------------------
  - type: redis
    name: gechexpress-redis
    plan: free
    ipAllowList: []

# ---------------------------------------------------------------------------
# PostgreSQL Database
# ---------------------------------------------------------------------------
databases:
  - name: gechexpress-db
    databaseName: gechexpress
    user: gechexpress
    plan: free
